<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vamos Conversar</title>
<meta name="theme-color" content="#3d8bfd" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <button id="btn-home" class="home-fab" aria-label="Início" title="Início">🏠</button>
  <div class="topbar__right">
    <button id="btn-edit" class="settings-fab" aria-label="Editar" title="Editar palavras e categorias">✏️</button>
    <button id="btn-settings" class="settings-fab" aria-label="Ajustes" title="Ajustes">⚙️</button>
  </div>
</div>
<div id="edit-banner" class="edit-banner">✏️ Modo de edição — toque no ✕ para excluir</div>

<!-- Início -->
<section id="screen-home" class="screen screen--active">
  <div class="home-title">O que você quer fazer?</div>
  <div class="home-buttons" id="home-buttons">
    <button class="home-btn home-btn--conversar" data-nav="conversar">
      <span class="home-btn__emoji">🗣️</span>
      <span>Conversar</span>
    </button>
    <button class="home-btn home-btn--aprender" data-nav="aprender">
      <span class="home-btn__emoji">📚</span>
      <span>Aprender</span>
    </button>
    <div id="home-extra-tiles" class="contents-wrapper"></div>
  </div>
</section>

<!-- Conversar -->
<section id="screen-conversar" class="screen">
  <div id="tabs" class="tabs"></div>
  <div id="grid-conversar" class="grid"></div>
</section>

<!-- Aprender (submenu de atividades) -->
<section id="screen-aprender" class="screen">
  <div id="aprender-grid" class="learn-menu"></div>
</section>

<!-- Atividade (Cores / Letras / Números / atividades customizadas) -->
<section id="screen-activity" class="screen">
  <div class="section-title" id="activity-title"></div>
  <div id="grid-activity" class="grid"></div>
</section>

<!-- Spotlight: reforço visual grande no centro (usado no Aprender) -->
<div id="spotlight" class="spotlight">
  <div class="spotlight__card">
    <div id="spotlight-emoji" class="spotlight__emoji"></div>
    <div id="spotlight-title" class="spotlight__title"></div>
    <div id="spotlight-subtitle" class="spotlight__subtitle"></div>
  </div>
</div>

<!-- Modal: adicionar palavra -->
<div id="modal-add" class="modal">
  <div class="modal__box">
    <div class="modal__title">Adicionar palavra</div>
    <label class="modal__field">
      Palavra
      <input id="add-label" type="text" placeholder="Ex: Vovó" maxlength="24" />
    </label>
    <div class="modal__field">
      Ícone
      <button id="add-emoji-trigger" class="emoji-trigger" type="button">
        <span id="add-emoji-preview">⭐</span>
      </button>
    </div>
    <div class="modal__actions">
      <button id="add-cancel" class="btn btn--ghost">Cancelar</button>
      <button id="add-save" class="btn btn--primary">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: adicionar categoria/atividade (página) -->
<div id="modal-add-category" class="modal">
  <div class="modal__box">
    <div class="modal__title" id="cat-modal-title">Nova categoria</div>
    <label class="modal__field">
      <span id="cat-field-label">Nome da categoria</span>
      <input id="cat-label" type="text" placeholder="Ex: Escola" maxlength="20" />
    </label>
    <div class="modal__field">
      Ícone
      <button id="cat-emoji-trigger" class="emoji-trigger" type="button">
        <span id="cat-emoji-preview">⭐</span>
      </button>
    </div>
    <div class="modal__actions">
      <button id="cat-cancel" class="btn btn--ghost">Cancelar</button>
      <button id="cat-save" class="btn btn--primary">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: seletor de emoji -->
<div id="modal-emoji" class="modal">
  <div class="modal__box modal__box--wide">
    <div class="modal__title">Escolha um ícone</div>
    <div id="emoji-group-tabs" class="tabs tabs--modal"></div>
    <div id="emoji-grid" class="emoji-grid"></div>
    <div class="modal__actions">
      <button id="emoji-cancel" class="btn btn--ghost">Fechar</button>
    </div>
  </div>
</div>

<!-- Modal: confirmar exclusão -->
<div id="modal-confirm" class="modal">
  <div class="modal__box">
    <div class="modal__title" id="confirm-title">Excluir?</div>
    <p id="confirm-message" class="modal__message"></p>
    <div class="modal__actions">
      <button id="confirm-cancel" class="btn btn--ghost">Cancelar</button>
      <button id="confirm-ok" class="btn btn--danger">Excluir</button>
    </div>
  </div>
</div>

<!-- Modal: ajustes de voz -->
<div id="modal-settings" class="modal">
  <div class="modal__box">
    <div class="modal__title">Ajustes de voz</div>
    <div class="modal__field">
      Velocidade da voz
      <div class="field-row">
        <input id="rate-range" type="range" min="0.5" max="1.3" step="0.1" />
        <button id="rate-test" class="btn btn--ghost">Testar</button>
      </div>
    </div>
    <div class="modal__actions">
      <button id="restore-hidden" class="btn btn--ghost">Restaurar itens apagados</button>
      <button id="settings-close" class="btn btn--primary">Fechar</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
